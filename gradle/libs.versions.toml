[versions]
kotlin = "2.4.20"
jvm = "21"
clikt = "5.1.0"
junit = "6.1.3"
kotlinx-coroutines = "1.10.2"
starlark = "4.2.1"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
sqlite = "3.53.4.0"
bouncycastle = "1.83"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
# Pure-Java Argon2id for password hashing (M6 design §3.2).
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
# Bazel's net.starlark.java, as packaged for Maven Central (D-060).
starlark = { module = "com.eed3si9n.starlark:starlark", version.ref = "starlark" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
