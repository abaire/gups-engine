[versions]
kotlin = "2.4.20"
jvm = "21"
clikt = "5.1.0"
junit = "6.1.3"
kotlinx-coroutines = "1.10.2"
starlark = "4.2.1"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
sqlite = "3.53.4.0"
bouncycastle = "1.83"
netty = "4.2.17.Final"
selenium = "4.49.0"
micrometer = "1.17.0"
slf4j = "2.0.19"
ktfmt = "0.59"
commonmark = "0.31.0"
spotless = "8.10.4"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
# Pure-Java Argon2id for password hashing.
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# Self-signed certificates for local TLS testing.
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
# Telnet and telnet-over-TLS listeners; the version Ktor 3.6 uses.
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
# HTTPS, the web client and WebSocket.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# Bazel's net.starlark.java, as packaged for Maven Central.
starlark = { module = "com.eed3si9n.starlark:starlark", version.ref = "starlark" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
# Prometheus metrics on the admin port.
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
# Libraries such as sqlite-jdbc log through SLF4J; the CLI discards it rather than warn about a missing provider.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# The headless browser test of the web client, Linux CI only.
selenium-java = { module = "org.seleniumhq.selenium:selenium-java", version.ref = "selenium" }
# The changelog and plugin guide in the HTML reference.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
