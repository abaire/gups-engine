name: Publish API reference

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and generate the API reference
        run: |
          ./gradlew :cli:installDist --console=plain
          cli/build/install/gups/bin/gups docs --out "$RUNNER_TEMP/gups-docs"
          test -f "$RUNNER_TEMP/gups-docs/index.html"

      - name: Update the documentation branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/gh-pages"
          existing_branch="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [ -n "$existing_branch" ]; then
            git fetch --depth=1 origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git -C "$RUNNER_TEMP/gh-pages" switch -c gh-pages --track origin/gh-pages
          else
            git -C "$RUNNER_TEMP/gh-pages" switch --orphan gh-pages
          fi
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/gups-docs/" "$RUNNER_TEMP/gh-pages/"
          touch "$RUNNER_TEMP/gh-pages/.nojekyll"
          git -C "$RUNNER_TEMP/gh-pages" add -A
          if ! git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/gh-pages" -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Update API reference"
            git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/gups-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
