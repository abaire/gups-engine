name: CI

on:
  push:
    branches: [main]
    # A version tag also publishes the release images.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Determine build properties
        id: props
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version_arg=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi
          # macOS runners have bash 3.2, which lacks ${VAR,,}.
          echo "owner_arg=-PimageOwner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify code formatting
        run: ./gradlew ktfmtCheck --console=plain

      - name: Build and test
        env:
          VERSION_ARG: ${{ steps.props.outputs.version_arg }}
        run: ./gradlew check :cli:installDist $VERSION_ARG --console=plain

      - name: Smoke-test the gups binary
        run: |
          cli/build/install/gups/bin/gups --version
          cli/build/install/gups/bin/gups --help
          cli/build/install/gups/bin/gups test --world template-world //...
          test -f cli/build/install/gups/docs/index.html

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: "**/build/reports/tests/"

      - name: Build the jlink image
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION_ARG: ${{ steps.props.outputs.version_arg }}
        run: ./gradlew :cli:jlinkArchive -Pplatform="$PLATFORM" $VERSION_ARG --console=plain

      - name: Smoke-test the jlink image
        run: |
          cli/build/image/gups/bin/gups --version
          cli/build/image/gups/bin/gups test --world template-world //...
          test -f cli/build/image/gups/docs/index.html

      - name: Upload the jlink image
        uses: actions/upload-artifact@v4
        with:
          name: gups-${{ matrix.platform }}
          path: cli/build/distributions/gups-*.tar.gz

      - name: Build the course-world-template archive
        if: matrix.platform == 'linux-x64'
        env:
          VERSION_ARG: ${{ steps.props.outputs.version_arg }}
          OWNER_ARG: ${{ steps.props.outputs.owner_arg }}
        run: ./gradlew :cli:courseWorldTemplateArchive "$OWNER_ARG" $VERSION_ARG --console=plain

      - name: Upload course-world-template archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: course-world-template
          path: cli/build/distributions/course-world-template-*.tar.gz

      - name: Build the API reference archive
        if: matrix.platform == 'linux-x64'
        env:
          VERSION_ARG: ${{ steps.props.outputs.version_arg }}
        run: ./gradlew :cli:docsArchive $VERSION_ARG --console=plain

      - name: Upload the API reference archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: gups-docs
          path: cli/build/distributions/gups-docs-*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz ./*.zip

  template-release:
    name: Sync course-world-template
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare stamped template
        run: ./gradlew :cli:prepareCourseWorldTemplate -Pversion="${GITHUB_REF_NAME#v}" -PimageOwner="${GITHUB_REPOSITORY_OWNER,,}" --console=plain

      - name: Sync to course-world-template repository
        env:
          TEMPLATE_DEPLOY_KEY: ${{ secrets.COURSE_WORLD_TEMPLATE_DEPLOY_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "$TEMPLATE_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$TEMPLATE_DEPLOY_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
            git clone "git@github.com:${GITHUB_REPOSITORY_OWNER}/course-world-template.git" /tmp/template-repo
            rsync -av --delete --exclude='.git' cli/build/template/course-world-template/ /tmp/template-repo/
            cd /tmp/template-repo
            git config user.name "gups-bot"
            git config user.email "bot@gups.dev"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Release $VERSION"
              git tag "$VERSION"
              git push origin main --tags
            fi
          else
            echo "No COURSE_WORLD_TEMPLATE_DEPLOY_KEY configured; template archive attached to GitHub release."
          fi

  image:
    name: OCI image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the distribution
        run: ./gradlew :cli:installDist -Pversion="${GITHUB_REF_NAME#v}" --console=plain

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the image
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gups" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
